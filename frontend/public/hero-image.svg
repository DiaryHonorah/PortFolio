<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066FF"/>
      <stop offset="100%" style="stop-color:#00D4FF"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B00"/>
      <stop offset="100%" style="stop-color:#FFAA00"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="500" height="400" fill="#0F0F1A" rx="20"/>
  <circle cx="400" cy="80" r="200" fill="#0066FF" opacity="0.1"/>
  <circle cx="100" cy="350" r="150" fill="#FF6B00" opacity="0.08"/>
  
  <!-- Code window -->
  <rect x="60" y="60" width="380" height="280" rx="12" fill="#1a1a2e" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <circle cx="85" cy="82" r="8" fill="#FF6B6B"/>
  <circle cx="110" cy="82" r="8" fill="#FFD93D"/>
  <circle cx="135" cy="82" r="8" fill="#6BCB77"/>
  
  <!-- Code lines -->
  <rect x="80" y="115" width="80" height="6" rx="3" fill="#0066FF" opacity="0.6"/>
  <rect x="80" y="135" width="140" height="6" rx="3" fill="#00D4FF" opacity="0.5"/>
  <rect x="100" y="155" width="200" height="6" rx="3" fill="#FF6B00" opacity="0.4"/>
  <rect x="100" y="175" width="160" height="6" rx="3" fill="#FFD93D" opacity="0.4"/>
  <rect x="80" y="195" width="120" height="6" rx="3" fill="#0066FF" opacity="0.6"/>
  <rect x="80" y="215" width="180" height="6" rx="3" fill="#00D4FF" opacity="0.5"/>
  <rect x="100" y="235" width="100" height="6" rx="3" fill="#FF6B00" opacity="0.4"/>
  <rect x="80" y="255" width="250" height="6" rx="3" fill="#0066FF" opacity="0.6"/>
  
  <!-- Network nodes -->
  <circle cx="380" cy="120" r="15" fill="none" stroke="url(#g1)" stroke-width="2"/>
  <circle cx="380" cy="120" r="6" fill="#00D4FF" opacity="0.8"/>
  <circle cx="420" cy="280" r="10" fill="none" stroke="url(#g2)" stroke-width="2"/>
  <circle cx="420" cy="280" r="4" fill="#FF6B00" opacity="0.8"/>
  <line x1="380" y1="120" x2="420" y2="280" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="4"/>
  <line x1="380" y1="120" x2="280" y2="340" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="4"/>
  <circle cx="280" cy="340" r="8" fill="none" stroke="#00D4FF" stroke-width="1.5"/>
  <circle cx="280" cy="340" r="3" fill="#00D4FF" opacity="0.6"/>
</svg>